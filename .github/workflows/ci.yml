name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # data/ is gitignored, so prove the pipeline works from a clean checkout
      - name: Build the warehouse from scratch
        run: |
          python src/generate_data.py
          python src/build_db.py

      - name: Edge cases, SQL-injection sweep, thread safety
        run: python tests/test_edge_cases.py

      - name: LLM path (mock provider - no API key needed)
        run: python tests/test_llm_path.py

      - name: App smoke test (real Streamlit threading)
        run: python tests/test_app_smoke.py

      - name: Evaluation suite (55 labelled questions)
        run: python eval/run_eval.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
